<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>衣服穿着记录</title>
  <style>
    body { font-family: Arial; max-width: 600px; margin: 40px auto; background: #fafafa; padding: 0 20px; }
    h1 { text-align: center; }
    .nav { text-align: center; margin-bottom: 20px; }
    .card { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    button { margin-top: 8px; padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ddd; background: #fff; }
    button:hover { background: #f0f0f0; }
    .warning { color: red; font-weight: bold; }
    input { padding: 6px; border-radius: 4px; border: 1px solid #ddd; }
    
    /* 页面切换逻辑 CSS */
    .page { display: none; }
    .active { display: block; }
    .settings-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
  </style>
</head>
<body>

  <h1>🧺 衣服穿着记录器</h1>

  <div class="nav">
    <button onclick="showPage('home-page')">🏠 穿着记录</button>
    <button onclick="showPage('settings-page')">⚙️ 洗涤设置</button>
  </div>

  <hr>

  <div id="home-page" class="page active">
    <input id="name" placeholder="输入衣服名字" />
    <button onclick="addCloth()">添加</button>
    <div id="list"></div>
  </div>

  <div id="settings-page" class="page">
    <h3>设置：穿几次需要洗？</h3>
    <div id="settings-list"></div>
  </div>

<script>
// 1. 初始化数据，增加 threshold (阈值)
let clothes = [
  { name: "毛衣", count: 0, threshold: 3 },
  { name: "衬衫", count: 0, threshold: 1 }
];

// 页面切换函数
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('active');
  render(); // 切换时重新渲染
}

function addCloth() {
  const name = document.getElementById("name").value;
  if (!name) return;
  // 默认阈值为 3
  clothes.push({ name, count: 0, threshold: 3 });
  document.getElementById("name").value = "";
  render();
}

function wear(index) {
  clothes[index].count += 1;
  render();
}

// 修改特定衣服的阈值
function updateThreshold(index, val) {
  clothes[index].threshold = parseInt(val) || 1;
  render();
}

function render() {
  // 渲染主页列表
  const list = document.getElementById("list");
  list.innerHTML = "";
  clothes.forEach((c, i) => {
    list.innerHTML += `
      <div class="card">
        <div>👗 ${c.name}</div>
        <div>穿了：${c.count} 次 / 目标：${c.threshold} 次后清洗</div>
        ${c.count >= c.threshold ? '<div class="warning">🧼 该洗了！</div>' : ''}
        <button onclick="wear(${i})">今天穿了 +1</button>
        <button onclick="clothes[${i}].count=0;render()">已清洗 (清零)</button>
      </div>
    `;
  });

  // 渲染设置页列表
  const setList = document.getElementById("settings-list");
  setList.innerHTML = "";
  clothes.forEach((c, i) => {
    setList.innerHTML += `
      <div class="settings-item">
        <span>${c.name}</span>
        <div>
          <input type="number" min="1" value="${c.threshold}" 
                 onchange="updateThreshold(${i}, this.value)" style="width: 50px"> 次
        </div>
      </div>
    `;
  });
}

// 初始渲染
render();
</script>

</body>
</html>
